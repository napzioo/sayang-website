<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kamu Sayang Aku Gaa??</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Poppins", sans-serif;
      overflow: hidden;
    }

    button {
      border: none;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }


    /* =====================================================
       QUESTION STATE
    ===================================================== */

    #questionState {

      width: 100%;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        linear-gradient(
          135deg,
          #ff9a9e 0%,
          #fecfef 100%
        );

      transition:
        opacity .45s ease,
        transform .45s ease;
    }

    #questionState.hide {

      opacity: 0;

      transform: scale(.96);

      pointer-events: none;
    }


    /* =====================================================
       CARD
    ===================================================== */

    .card {

      position: relative;

      width: 100%;
      max-width: 320px;

      padding:
        30px
        20px
        120px;

      background: white;

      border-radius: 24px;

      text-align: center;

      overflow: visible;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, .12);
    }


    /* =====================================================
       CHARACTER
    ===================================================== */

    .character {

      width: 105px;
      height: 105px;

      margin:
        0 auto
        18px;

      display: flex;

      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background:
        #fff1f6;

      font-size: 56px;

      overflow: hidden;
    }


    /* =====================================================
       QUESTION TITLE
    ===================================================== */

    #questionTitle {

      min-height: 75px;

      display: flex;

      justify-content: center;
      align-items: center;

      margin-bottom: 22px;

      font-family: "Caveat", cursive;

      font-size: 32px;

      line-height: 1.15;

      color: #333;

      opacity: 1;

      transform:
        translateY(0);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    #questionTitle.fade {

      opacity: 0;

      transform:
        translateY(8px);
    }


    /* =====================================================
       BUTTON CONTAINER
    ===================================================== */

    .buttons {

      width: 100%;

      display: flex;

      flex-direction: row;

      justify-content: center;

      align-items: center;

      gap: 12px;

      overflow: visible;
    }


    /* =====================================================
       YES BUTTON
    ===================================================== */

    #yesButton {

      position: relative;

      width: 160px;
      height: 48px;

      flex-shrink: 0;

      border-radius: 999px;

      background:
        #2ecc71;

      color: white;

      font-size: 15px;

      font-weight: 600;

      z-index: 100;

      transform:
        scale(1);

      box-shadow:
        0 8px 20px
        rgba(46, 204, 113, .25);

      transition:
        transform .65s
        cubic-bezier(.22, 1, .36, 1),

        width .65s
        cubic-bezier(.22, 1, .36, 1),

        height .65s
        cubic-bezier(.22, 1, .36, 1),

        border-radius .65s
        cubic-bezier(.22, 1, .36, 1),

        font-size .65s ease;
    }


    /* =====================================================
       NO BUTTON
    ===================================================== */

    #noButton {

      position: relative;

      width: 100px;
      height: 48px;

      flex-shrink: 0;

      border-radius: 999px;

      background:
        #e74c3c;

      color: white;

      font-size: 15px;

      font-weight: 600;

      z-index: 50;

      transform:
        translateY(0)
        scale(1);

      opacity: 1;

      transition:
        transform .5s
        cubic-bezier(.22, 1, .36, 1),

        opacity .5s ease;
    }


    /* =====================================================
       FULLSCREEN YES
    ===================================================== */

    #yesButton.fullscreen {

      position: fixed;

      left: 0;
      top: 0;

      width: 100vw;
      height: 100vh;

      border-radius: 0;

      z-index: 9999;

      transform:
        scale(1);

      font-size:
        clamp(
          32px,
          8vw,
          70px
        );
    }


    /* =====================================================
       TRANSITION STATE
    ===================================================== */

    #transitionState {

      position: fixed;

      inset: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      background:
        #2ecc71;

      z-index: 9998;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .35s ease;
    }

    #transitionState.show {

      opacity: 1;

      visibility: visible;
    }


    .transitionText {

      padding: 20px;

      color: white;

      text-align: center;

      font-family:
        "Caveat",
        cursive;

      font-size:
        clamp(
          42px,
          12vw,
          90px
        );
    }


    /* =====================================================
       RESULT STATE
    ===================================================== */

    #resultState {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding:
        25px
        15px
        40px;

      background:
        linear-gradient(
          135deg,
          #ff9a9e 0%,
          #fecfef 100%
        );

      overflow-y: auto;
      overflow-x: hidden;

      z-index: 10000;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .5s ease;
    }

    #resultState.show {

      opacity: 1;

      visibility: visible;
    }


    /* =====================================================
       RESULT CONTENT
    ===================================================== */

    .resultContent {

      position: relative;

      z-index: 10;

      width: 100%;

      max-width: 390px;

      margin: 0 auto;

      text-align: center;
    }


    /* =====================================================
       RESULT TITLE
    ===================================================== */

    #resultTitle {

      margin-bottom: 10px;

      color: white;

      font-family:
        "Caveat",
        cursive;

      font-size:
        clamp(
          42px,
          12vw,
          64px
        );

      line-height: 1.05;

      text-shadow:
        0 5px 15px
        rgba(0, 0, 0, .1);

      animation:
        resultTitleIn
        .7s
        cubic-bezier(.22, 1, .36, 1)
        both;
    }


    @keyframes resultTitleIn {

      from {

        opacity: 0;

        transform:
          translateY(20px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =====================================================
       RESULT SUBTITLE
    ===================================================== */

    #resultSubtitle {

      margin-bottom: 22px;

      color: white;

      font-size: 16px;

      font-weight: 600;

      line-height: 1.5;

      animation:
        subtitleIn
        .7s
        cubic-bezier(.22, 1, .36, 1)
        .15s
        both;
    }


    @keyframes subtitleIn {

      from {

        opacity: 0;

        transform:
          translateY(15px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =====================================================
       GALLERY
    ===================================================== */

    #gallery {

      width: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      margin: 0 auto;

      position: relative;

      z-index: 10;
    }


    /* =====================================================
       4 PHOTO GRID
    ===================================================== */

    .gallery-polaroid {

      width: 100%;

      max-width: 285px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      justify-items: center;

      align-items: center;

      gap: 16px 8px;

      padding:
        10px 0
        30px;
    }


    /* =====================================================
       POLAROID
    ===================================================== */

    .polaroid {

      --rotation: 0deg;

      position: relative;

      width: 120px;

      padding:
        7px
        7px
        21px;

      background:
        white;

      border-radius: 4px;

      box-shadow:
        0 8px 20px
        rgba(0, 0, 0, .18);

      opacity: 0;

      transform:
        translateY(35px)
        rotate(var(--rotation))
        scale(.94);

      animation:
        polaroidAppear
        .7s
        cubic-bezier(.22, 1, .36, 1)
        forwards;
    }


    .polaroid img {

      display: block;

      width: 100%;

      aspect-ratio:
        1 / 1.15;

      object-fit: cover;

      background:
        #f4f4f4;
    }


    /* =====================================================
       POLAROID ANIMATION
    ===================================================== */

    @keyframes polaroidAppear {

      from {

        opacity: 0;

        transform:
          translateY(35px)
          rotate(var(--rotation))
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          rotate(var(--rotation))
          scale(1);
      }
    }


    /* =====================================================
       HEARTS
    ===================================================== */

    #hearts {

      position: fixed;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 1;
    }


    .heart {

      position: absolute;

      top: -60px;

      color: white;

      user-select: none;

      pointer-events: none;

      animation:
        fallHeart
        linear
        infinite;
    }


    @keyframes fallHeart {

      0% {

        transform:
          translate3d(
            0,
            -60px,
            0
          )
          rotate(0deg);
      }

      25% {

        transform:
          translate3d(
            20px,
            25vh,
            0
          )
          rotate(15deg);
      }

      50% {

        transform:
          translate3d(
            -20px,
            50vh,
            0
          )
          rotate(-15deg);
      }

      75% {

        transform:
          translate3d(
            20px,
            75vh,
            0
          )
          rotate(15deg);
      }

      100% {

        transform:
          translate3d(
            -10px,
            110vh,
            0
          )
          rotate(-10deg);
      }
    }


    /* =====================================================
       SMALL SCREEN
    ===================================================== */

    @media (max-width: 360px) {

      .card {

        padding-left: 14px;

        padding-right: 14px;
      }

      #questionTitle {

        font-size: 29px;
      }

      #yesButton {

        width: 145px;

        font-size: 14px;
      }

      #noButton {

        width: 90px;

        font-size: 14px;
      }

      .gallery-polaroid {

        max-width: 260px;

        gap: 14px 5px;
      }

      .polaroid {

        width: 108px;
      }
    }


    /* =====================================================
       VERY SHORT SCREEN
    ===================================================== */

    @media (max-height: 650px) {

      #resultState {

        padding-top: 15px;
      }

      #resultTitle {

        font-size: 46px;
      }

      .gallery-polaroid {

        gap: 12px 5px;

        padding-bottom: 20px;
      }

      .polaroid {

        width: 105px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       STATE 1
  ===================================================== -->

  <main id="questionState">

    <section class="card">


      <!-- CHARACTER -->

      <div
        id="characterMedia"
        class="character"
      >
        🥺
      </div>


      <!-- QUESTION -->

      <h1 id="questionTitle">
        Kamu sayang aku gaa??
      </h1>


      <!-- BUTTONS -->

      <div class="buttons">

        <button
          id="yesButton"
          type="button"
        >
          Iyaa aku sayang
        </button>


        <button
          id="noButton"
          type="button"
        >
          Gakk
        </button>

      </div>

    </section>

  </main>


  <!-- =====================================================
       STATE 2
  ===================================================== -->

  <section
    id="transitionState"
    aria-hidden="true"
  >

    <div class="transitionText">
      Iyaa aku sayang ❤️
    </div>

  </section>


  <!-- =====================================================
       STATE 3
  ===================================================== -->

  <section
    id="resultState"
    aria-hidden="true"
  >


    <!-- FALLING HEARTS -->

    <div id="hearts"></div>


    <div class="resultContent">


      <!-- TITLE -->

      <h2 id="resultTitle">
        Yeayy! Makasih ya ❤️
      </h2>


      <!-- SUBTITLE -->

      <p id="resultSubtitle">
        Aku juga sayang kamu kok!
      </p>


      <!-- FOUR PHOTOS -->

      <div id="gallery"></div>


    </div>

  </section>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const config = {

      questionTexts: [

        "Kamu sayang aku gaa??",

        "Yakin nih gamau bilang sayang?",

        "Coba deh dipikir lagi...",

        "Ish, masa gak sayang sih 🥺",

        "Terakhir nih, sayang gak?"

      ],


      yesText:
        "Iyaa aku sayang",


      noText:
        "Gakk",


      maxNoClicks:
        6,


      resultTitle:
        "Yeayy! Makasih ya ❤️",


      resultSubtitle:
        "Aku juga sayang kamu kok!",


      galleryPhotos: [

        "IMG-20260908-WA0002.jpg",

        "IMG-20260908-WA0007.jpg",

        "IMG-20260911-WA0000.jpg",

        "IMG-20260917-WA0020.jpg"

      ]

    };


    /* =====================================================
       WAIT UNTIL PAGE READY
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* =================================================
           GET ELEMENTS
        ================================================= */

        const questionState =
          document.getElementById(
            "questionState"
          );


        const transitionState =
          document.getElementById(
            "transitionState"
          );


        const resultState =
          document.getElementById(
            "resultState"
          );


        const questionTitle =
          document.getElementById(
            "questionTitle"
          );


        const yesButton =
          document.getElementById(
            "yesButton"
          );


        const noButton =
          document.getElementById(
            "noButton"
          );


        const resultTitle =
          document.getElementById(
            "resultTitle"
          );


        const resultSubtitle =
          document.getElementById(
            "resultSubtitle"
          );


        const gallery =
          document.getElementById(
            "gallery"
          );


        const hearts =
          document.getElementById(
            "hearts"
          );


        /* =================================================
           INITIAL TEXT
        ================================================= */

        questionTitle.textContent =
          config.questionTexts[0];


        yesButton.textContent =
          config.yesText;


        noButton.textContent =
          config.noText;


        resultTitle.textContent =
          config.resultTitle;


        resultSubtitle.textContent =
          config.resultSubtitle;


        /* =================================================
           VARIABLES
        ================================================= */

        let noClickCount = 0;

        let finished = false;


        /* =================================================
           CHANGE QUESTION
        ================================================= */

        function changeQuestion(index) {

          questionTitle.classList.add(
            "fade"
          );


          setTimeout(
            function () {

              questionTitle.textContent =
                config.questionTexts[index];


              questionTitle.classList.remove(
                "fade"
              );

            },
            200
          );
        }


        /* =================================================
           NO BUTTON
        ================================================= */

        noButton.addEventListener(
          "click",
          function (event) {

            event.preventDefault();


            if (finished) {

              return;
            }


            noClickCount++;


            /* ---------------------------------------------
               CHANGE QUESTION
            --------------------------------------------- */

            const questionIndex =
              Math.min(
                noClickCount,
                config.questionTexts.length - 1
              );


            changeQuestion(
              questionIndex
            );


            /* ---------------------------------------------
               MOVE NO DOWN
            --------------------------------------------- */

            const scale =
              Math.max(
                0.15,
                1 -
                (noClickCount * 0.15)
              );


            const translateY =
              noClickCount * 15;


            const opacity =
              Math.max(
                0.3,
                1 -
                (noClickCount * 0.12)
              );


            noButton.style.transform =
              `translateY(${translateY}px) scale(${scale})`;


            noButton.style.opacity =
              opacity;


            /* ---------------------------------------------
               GROW YES
            --------------------------------------------- */

            const progress =
              Math.min(
                1,
                noClickCount /
                config.maxNoClicks
